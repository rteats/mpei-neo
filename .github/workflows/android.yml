name: Android CI and APK release

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint and APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run unit tests and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug

      - name: Build optimized test release APK
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          gradle --no-daemon assembleRelease             -PTEST_RELEASE_SIGNING=true             -PVERSION_CODE=${{ github.run_number }}             -PVERSION_NAME=0.2.${{ github.run_number }}-test
          cp app/build/outputs/apk/release/app-release.apk MPEI-Neo-release-test.apk

      - name: Upload optimized test release APK
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mpei-neo-release-test-apk
          path: MPEI-Neo-release-test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Validate main release signing secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Materialize main release keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mpei-neo-release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/mpei-neo-release.p12" >> "$GITHUB_ENV"

      - name: Build optimized signed main release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: PKCS12
        run: |
          gradle --no-daemon assembleRelease             -PVERSION_CODE=${{ github.run_number }}             -PVERSION_NAME=0.2.${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk             MPEI-Neo-v0.2.${{ github.run_number }}.apk

      - name: Upload main release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mpei-neo-release-apk
          path: MPEI-Neo-v0.2.${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  instrumentation:
    name: Emulator UI and memory-leak tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI and LeakCanary tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            gradle --no-daemon assembleRelease -PTEST_RELEASE_SIGNING=true -PVERSION_CODE=${{ github.run_number }} -PVERSION_NAME=0.2.${{ github.run_number }}-smoke
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am force-stop com.rteats.mpeineo
            adb logcat -c
            adb shell monkey -p com.rteats.mpeineo -c android.intent.category.LAUNCHER 1
            sleep 5
            if ! adb shell pidof com.rteats.mpeineo >/dev/null; then
              echo "::error::Release APK crashed on launch"
              adb logcat -d '*:E'
              exit 1
            fi

      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish successful main release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - verify
      - instrumentation
    runs-on: ubuntu-latest
    steps:
      - name: Download verified release APK
        uses: actions/download-artifact@v5
        with:
          name: mpei-neo-release-apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: MPEI Neo 0.2.${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: MPEI-Neo-v0.2.${{ github.run_number }}.apk
