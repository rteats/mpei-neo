name: Dev APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-apk
  cancel-in-progress: true

env:
  DEV_BASE_VERSION: "0.4.0"

jobs:
  build-dev:
    name: Build rolling dev APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Materialize public dev keystore
        run: |
          base64 --decode ci/mpei-neo-dev.p12.b64 > "$RUNNER_TEMP/mpei-neo-dev.p12"
          echo "ANDROID_DEV_KEYSTORE_FILE=$RUNNER_TEMP/mpei-neo-dev.p12" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEYSTORE_PASSWORD=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEY_ALIAS=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEY_PASSWORD=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"

      - name: Build signed dev APK
        run: |
          gradle --no-daemon assembleDevRelease             -PVERSION_CODE=${{ github.run_number }}             -PVERSION_NAME=${DEV_BASE_VERSION}-dev.${{ github.run_number }}
          cp app/build/outputs/apk/dev/release/app-dev-release.apk MPEI-Neo-Dev.apk

      - name: Upload dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpei-neo-dev-apk
          path: MPEI-Neo-Dev.apk
          if-no-files-found: error
          retention-days: 14

      - name: Move rolling dev tag
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push origin refs/tags/dev --force

      - name: Publish rolling dev prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: MPEI Neo Dev ${{ env.DEV_BASE_VERSION }}-dev.${{ github.run_number }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            Automated development build from `main`.

            versionCode: ${{ github.run_number }}
            versionName: ${{ env.DEV_BASE_VERSION }}-dev.${{ github.run_number }}
            commit: ${{ github.sha }}

            This package is `com.rteats.mpeineo.dev` and uses the public disposable development signing key.
          files: MPEI-Neo-Dev.apk
