name: Stable release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version, for example 0.4.0
        required: true
        default: "0.4.0"

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build stable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      apk_name: ${{ steps.meta.outputs.apk_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve stable version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          APK_NAME="MPEI-Neo-v${VERSION}.apk"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate stable signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Materialize stable keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mpei-neo-release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/mpei-neo-release.p12" >> "$GITHUB_ENV"

      - name: Unit tests and lint
        run: gradle --no-daemon testStableDebugUnitTest lintStableDebug

      - name: Build signed stable APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: PKCS12
        run: |
          gradle --no-daemon assembleStableRelease             -PVERSION_CODE=${{ steps.meta.outputs.version_code }}             -PVERSION_NAME=${{ steps.meta.outputs.version }}
          cp app/build/outputs/apk/stable/release/app-stable-release.apk "${{ steps.meta.outputs.apk_name }}"

      - name: Upload stable APK
        uses: actions/upload-artifact@v4
        with:
          name: mpei-neo-stable-apk
          path: ${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stable-verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  instrumentation:
    name: Stable emulator smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Download exact stable APK
        uses: actions/download-artifact@v5
        with:
          name: mpei-neo-stable-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests and exact stable APK smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon connectedStableDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.rteats.mpeineo.UiSmokeTest
            adb uninstall com.rteats.mpeineo || true
            adb install "${{ needs.build.outputs.apk_name }}"
            adb logcat -c
            adb shell am start -W -n com.rteats.mpeineo/.MainActivity
            sleep 5
            adb shell pidof com.rteats.mpeineo >/dev/null

      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stable-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish stable GitHub Release
    needs:
      - build
      - instrumentation
    runs-on: ubuntu-latest
    steps:
      - name: Download tested stable APK
        uses: actions/download-artifact@v5
        with:
          name: mpei-neo-stable-apk

      - name: Publish stable release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MPEI Neo ${{ needs.build.outputs.version }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: ${{ needs.build.outputs.apk_name }}
